name: Dependabot auto-merge

# Enables auto-merge on Dependabot's grouped npm PRs (the "security" and
# "minor-patch" groups in dependabot.yml) when every bump in the PR is a minor or
# patch release; majors and GitHub Actions bumps need a manual review. GitHub merges
# them only after the required status checks (the "test" job) pass, which needs
# "Allow auto-merge" on the repo and branch protection requiring that check.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'jalaziz/unifi-cloudflare-ddns'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # update-type is the highest semver change in the PR; an empty value
      # (unknown/non-semver) is treated as unsafe and left for manual review.
      - name: Enable auto-merge for minor/patch npm updates
        if: >-
          (steps.metadata.outputs.dependency-group == 'security' ||
           steps.metadata.outputs.dependency-group == 'minor-patch') &&
          (steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
           steps.metadata.outputs.update-type == 'version-update:semver-patch')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
